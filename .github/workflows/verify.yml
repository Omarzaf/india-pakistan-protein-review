name: Verify review package and website
on:
  pull_request:
  push:
    branches: [review]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify public artifact and scientific boundaries
        run: |
          node website/tools/verify.mjs
          node --test website/tests/*.test.mjs
      - name: Reproduce the original review package in isolation
        run: |
          node website/tools/export-review.mjs "$RUNNER_TEMP/protein-review"
          cd "$RUNNER_TEMP/protein-review"
          python -m venv .venv
          . .venv/bin/activate
          export PYTHONDONTWRITEBYTECODE=1
          python scripts/reproduce.py
          python -m unittest discover -s tests -v
          python scripts/check_release.py
